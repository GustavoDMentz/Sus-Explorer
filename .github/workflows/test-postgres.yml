name: Test PostgreSQL foundation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: sus_explorer_test
          POSTGRES_USER: sus_explorer_test
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sus_explorer_test -d sus_explorer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: sus_explorer_test
      POSTGRES_USER: sus_explorer_test
      POSTGRES_PASSWORD: disposable-test-password
      SUS_EXPLORER_TEST_DB: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt

      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest tests -q
