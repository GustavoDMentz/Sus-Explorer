services:
  ollama:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    restart: unless-stopped

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        echo "Verificando modelo de inferencia..."
        ollama show "$$OLLAMA_CHAT_MODEL" > /dev/null 2>&1 || ollama pull "$$OLLAMA_CHAT_MODEL"

        echo "Verificando modelo de embeddings..."
        ollama show "$$OLLAMA_EMBEDDING_MODEL" > /dev/null 2>&1 || ollama pull "$$OLLAMA_EMBEDDING_MODEL"

        echo "Todos os modelos estao disponiveis."
        ollama list

  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sus_explorer}
      POSTGRES_USER: ${POSTGRES_USER:-sus_explorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Set POSTGRES_INGEST_PASSWORD in .env}
      POSTGRES_HISTORY_PASSWORD: ${POSTGRES_HISTORY_PASSWORD:?Set POSTGRES_HISTORY_PASSWORD in .env}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_MIGRATOR_PASSWORD"
          psql -h 127.0.0.1
          -U sus_explorer_admin
          -d "$$POSTGRES_DB"
          -v ON_ERROR_STOP=1
          -tAc 'SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-sus_explorer}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-sus_explorer_admin}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      POSTGRES_REQUIRE_PROFILES: "1"
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-sus_explorer}
      POSTGRES_SSLMODE: disable
      POSTGRES_TRUSTED_INTERNAL_NETWORK: "1"
    command: ["python", "-m", "sus_explorer.data.persistence.migrate"]

  index-docs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-sus_explorer}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-sus_explorer_admin}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      POSTGRES_REQUIRE_PROFILES: "1"
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-sus_explorer}
      POSTGRES_SSLMODE: disable
      POSTGRES_TRUSTED_INTERNAL_NETWORK: "1"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TRUSTED_INTERNAL_NETWORK: "1"
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_EMBED_TIMEOUT: ${OLLAMA_EMBED_TIMEOUT:-120}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-700}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
    command:
      - python
      - -m
      - sus_explorer.data.persistence.index_knowledge
      - docs
      - docs/architecture.md
      - docs/data-sources.md
      - docs/analytics.md

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
      index-docs:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-sus_explorer}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-sus_explorer_app}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_REQUIRE_PROFILES: "1"
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-sus_explorer}
      POSTGRES_SSLMODE: disable
      POSTGRES_TRUSTED_INTERNAL_NETWORK: "1"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TRUSTED_INTERNAL_NETWORK: "1"
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-120}
      OLLAMA_EMBED_TIMEOUT: ${OLLAMA_EMBED_TIMEOUT:-120}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
      OLLAMA_MAX_CONCURRENT: ${OLLAMA_MAX_CONCURRENT:-1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_QUEUE_TIMEOUT: ${OLLAMA_QUEUE_TIMEOUT:-60}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.65}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-700}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      RAG_CONTEXT_CHARS: ${RAG_CONTEXT_CHARS:-3500}
    ports:
      - "127.0.0.1:8501:8501"
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

volumes:
  postgres_data_v2:
  ollama_data:
