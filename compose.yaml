
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sus_explorer}
      POSTGRES_USER: ${POSTGRES_USER:-sus_explorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
